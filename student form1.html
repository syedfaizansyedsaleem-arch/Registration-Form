<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student  Registration Form</title>




    
   
</head>
<body style="background-color: aqua;">
  
   <Table border="1"
   style="margin-left:auto;margin-right:auto;width: 50%;">
     <tr>
          <th>

            Student Registration Form


          </th>

     </tr>




   </Table>
   <form>
  
      <div class="form-group">
    Name: <input type="Name" placeholder="Enter Full Name">
    <br><br>
    Farher's Name: <input type="Father's Name">
    <br><br>
    Mother's Name: <input type="Mother's Name">
    <br><br>
    Phone Number: <input type="Phone Number" placeholder="017xxxxxxx">
    <br><br>
    Email: <input type="Email" placeholder="sample@example.com"><br><br>
    Gender: <label for="Male">Male</label>
    <input type="radio" id="Male" name="Gender" value="Male">
    <label for="Female">Female</label>
    <input type="radio" id="Female" name="Gender" value="Female">
    <label for="other">other</label> 
    <input type="radio" id="other" name="Gender" value="other"><br><br>
     Date of Brith: <label></label>
     <select name="day">
        <option>Day</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <!--Add  Days up to 31-->
        </select>


  <select name="Month">
        <option>Month</option>
        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>july</option>
        <option>August</option>
        <option>September</option>
        <option>october</option>
        <option>November</option>
        <option>December</option>

</select>

 <select name="Year">
        <option>year</option>
        <option>2010</option>
        <option>2011</option>
        <option>2012</option>
        <option>2013</option>
        <option>2014</option>
        <option>2015</option>
        <option>2016</option>
        <option>2017</option>
        <option>2018</option>
        <option>2019</option>
        <option>2020</option>
        <option>2021</option>
        <option>2022</option>
        <option>2023</option>
        <option>2024</option>
        <option>2025</option>
        <option>2026</option>


</select><br><br>
Address: <input type="Address" placeholder="street-house-road:-">
<br><br>
Blood Group:<label></label>
       <select>
       <option>Select</option>
         <option>A+</option>
        <option>B+</option>
        <option>AB+</option>
        <option>o+</option>
        <option>o-</option>
        <option>A-</option>

       </select> <br><br>
       
       Department:
        
 <label for="CSE">CSE</label>
    <input type="radio" id="CSE" name="Department" value="CSE">
    <label for="EEE">EEE</label>
    <input type="radio" id="EEE" name="Department" value="EEE">
    <label for="BBA">BBA</label> 
    <input type="radio" id="BBA" name="Department" value="BBA"><br>

    
    Course: 
    <label for="C">C</label>
    <input type="checkbox" id="C" name="Course" value="C">
    <label for="C++">C++</label>
    <input type="checkbox" id="C++" name="Course" value="C++">
    <label for="Java">Java</label> 
    <input type="checkbox" id="Java" name="Course" value="Java">
  <label for="AI">AI</label>
    <input type="checkbox" id="AI" name="Course" value="AI">
    <label for="Machine learning">Machine learning</label>
    <input type="checkbox" id="Machine learning" name="Course" value="Machine learning">
    <label for="Robotics">Robotics</label> 
    <input type="checkbox" id="Robotics" name="Course" value="Robotics"><br><br>
    photo: <input type="file"><br><br>
     submit
     <input type="Reset">
  


   </form> 
    
    
</body>
       
</html>
